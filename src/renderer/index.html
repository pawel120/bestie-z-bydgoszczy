<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://api.elevenlabs.io; frame-src 'self' about: data:">
  <title>Bestie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <span class="logo"><svg stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg></span>
      <span>Bestie</span>
    </div>
    <div class="divider"></div>
    <button id="record" class="record"><i class="dot"></i><span>Nagrywaj</span><kbd>⌘R</kbd></button>
    <span id="timer" class="timer">00:00</span>
    <span class="spacer"></span>
    <button id="replay" class="ghost" title="Odtwórz zapisany transkrypt — demo bez nagrywania">
      <svg stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span>Wczytaj transkrypt</span>
    </button>
    <input id="replay-file" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
    <select id="language" class="ghost" title="Język transkrypcji">
      <option value="auto">Język: auto</option>
      <option value="pl">Polski</option>
      <option value="en">English</option>
    </select>
    <button id="reveal" class="ghost icon" title="Pokaż nagrania">
      <svg stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
    </button>
    <details id="settings" class="settings">
      <summary class="ghost icon" title="Ustawienia">
        <svg stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </summary>
      <div class="settings-panel">
        <h4>Klucze API</h4>
        <label>ElevenLabs <small>transkrypcja</small>
          <input id="key-elevenlabs" type="password" autocomplete="off" placeholder="sk_…">
        </label>
        <label>Groq <small>tablica</small>
          <input id="key-groq" type="password" autocomplete="off" placeholder="gsk_…">
        </label>
        <label>Claude <small>rysowanie kart (opcjonalnie)</small>
          <input id="key-anthropic" type="password" autocomplete="off" placeholder="sk-ant-…">
        </label>
        <button id="save-keys" class="primary">Zapisz</button>
        <p class="hint">Szyfrowane systemowo (Keychain / libsecret). Zmienne <code>ELEVENLABS_API_KEY</code>, <code>GROQ_API_KEY</code> i <code>ANTHROPIC_API_KEY</code> mają pierwszeństwo.</p>
      </div>
    </details>
  </header>
  <main>
    <aside class="transcript-panel">
      <header class="panel-header">
        <h2>Transkrypcja</h2>
        <span id="transcript-count" class="count"></span>
        <span class="spacer"></span>
        <span class="legend"><i class="me"></i>Ja <i class="others"></i>Rozmówcy</span>
      </header>
      <section id="transcript" class="transcript"></section>
    </aside>
    <section class="whiteboard">
      <header class="panel-header">
        <h2>Tablica</h2>
        <label class="switch"><input id="board-enabled" type="checkbox"><span></span>AI na żywo</label>
        <span id="board-status" class="board-status"></span>
        <span class="spacer"></span>
        <button id="board-refresh" class="ghost" title="Przerysuj tablicę teraz">
          <svg stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg><span>Odśwież</span>
        </button>
      </header>
      <div id="board" class="board"></div>
    </section>
  </main>
  <footer id="status" class="status" hidden></footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>
