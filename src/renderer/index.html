<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://api.elevenlabs.io; frame-src 'self' about: data:">
  <title>Bestie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <button id="record" class="record"><i></i><span>Nagrywaj</span></button>
    <span id="timer" class="timer">00:00</span>
    <button id="replay" title="Odtwórz zapisany transkrypt — demo bez nagrywania">Wczytaj transkrypt</button>
    <input id="replay-file" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
    <span class="spacer"></span>
    <select id="language" title="Język transkrypcji">
      <option value="auto">Auto</option>
      <option value="pl">Polski</option>
      <option value="en">English</option>
    </select>
    <button id="reveal" title="Pokaż nagrania">📁</button>
    <details id="settings" class="settings">
      <summary title="Ustawienia">⚙︎</summary>
      <div class="settings-panel">
        <label>Klucz API ElevenLabs (transkrypcja)
          <input id="key-elevenlabs" type="password" autocomplete="off" placeholder="sk_…">
        </label>
        <label>Klucz API Groq (tablica)
          <input id="key-groq" type="password" autocomplete="off" placeholder="gsk_…">
        </label>
        <button id="save-keys">Zapisz</button>
        <p class="hint">Szyfrowane systemowo (Keychain / libsecret). <code>ELEVENLABS_API_KEY</code> i <code>GROQ_API_KEY</code> mają pierwszeństwo.</p>
      </div>
    </details>
  </header>
  <main>
    <section id="transcript" class="transcript"></section>
    <section class="whiteboard">
      <header>
        <h2>Tablica</h2>
        <label class="toggle"><input id="board-enabled" type="checkbox"> AI na żywo</label>
        <span id="board-status" class="board-status"></span>
        <span class="spacer"></span>
        <button id="board-refresh" title="Przerysuj tablicę teraz">↻ Odśwież</button>
      </header>
      <div id="board" class="board"></div>
    </section>
  </main>
  <footer id="status" class="status" hidden></footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>
